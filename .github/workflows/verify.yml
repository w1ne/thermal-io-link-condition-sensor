name: source-build-and-regressions
on:
  push:
  pull_request:
jobs:
  classifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise thermal classifier and exact process-data encoder
        run: tests/run-host.sh
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build actual ESP-IDF firmware from source
        run: platformio run -d firmware
      - name: Archive reproducible CPU and flash images
        uses: actions/upload-artifact@v4
        with:
          name: thermal-esp32c3-firmware
          include-hidden-files: true
          if-no-files-found: error
          path: |
            firmware/.pio/build/esp32c3/firmware.elf
            firmware/.pio/build/esp32c3/firmware.bin
            firmware/.pio/build/esp32c3/bootloader.bin
            firmware/.pio/build/esp32c3/partitions.bin
