schema_version: "1.0"
inputs:
  firmware: "../firmware/firmware.elf"
  system: "./system_manifest.yaml"
limits:
  max_steps: 50000000
assertions:
  - uart_contains: "TFS BOOT"
  - uart_contains: "MLX90640 READY"
  - uart_contains: "IOLINK INIT OK"
  - uart_contains: "STATE=04 OPERATE"
  - uart_contains: "fault=NONE"
  - uart_contains: "TFS DONE"
