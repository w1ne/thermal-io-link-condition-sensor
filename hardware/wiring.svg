<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="560" viewBox="0 0 1050 560"><rect width="1050" height="560" fill="#fff"/><g font-family="sans-serif" fill="#17202a"><text x="30" y="38" font-size="24">Thermal IO-Link reference · connection diagram</text><text x="30" y="68" font-size="15">Read wiring.md for power isolation, jumpers and mandatory IN1/R102 modification.</text><g fill="#edf3ff" stroke="#456"><rect x="30" y="120" width="230" height="260" rx="10"/><rect x="460" y="100" width="250" height="110" rx="10"/><rect x="460" y="290" width="250" height="150" rx="10"/><rect x="840" y="290" width="180" height="150" rx="10"/></g><text x="45" y="155" font-size="18">ESP32-C3-DevKitM-1</text><text x="45" y="185">USB powered</text><text x="45" y="225">GPIO0 SDA / GPIO1 SCL</text><text x="45" y="255">GPIO4 TX / GPIO5 RX</text><text x="45" y="285">GPIO6 EN / GPIO7 OL</text><text x="45" y="315">GPIO10 DIAG / GND</text><text x="475" y="135" font-size="18">MLX90640 breakout</text><text x="475" y="165">3V3, GND, SDA, SCL</text><text x="475" y="190">0x33 · 400 kHz</text><text x="475" y="325" font-size="18">STEVAL-IOD003V1</text><text x="475" y="355">L6362A 3.3V logic</text><text x="475" y="385">IN1 grounded after R102 removal</text><text x="475" y="415">24V supply from master</text><text x="855" y="330" font-size="18">IO-Link master</text><text x="855" y="365">L+ · L− · C/Q</text><g fill="none" stroke="#345" stroke-width="3"><path d="M260 225 H350 V155 H460"/><path d="M260 285 H350 V360 H460"/><path d="M710 360 H840"/></g><text x="720" y="345">24V C/Q</text><text x="30" y="490" font-size="18">Common ground only between USB MCU and shield; do not join independent supply rails.</text><text x="30" y="525" font-size="18">No ESP32 GPIO connects directly to C/Q. Camera uses MCU 3V3; PHY uses master L+.</text></g></svg>